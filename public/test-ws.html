<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    <button onclick="testConnection()">Test WebSocket</button>
    <div id="output"></div>
    
    <script>
        function testConnection() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>Connecting to ws://localhost:12345...</p>';
            
            const ws = new WebSocket('ws://localhost:12345');
            
            ws.onopen = function() {
                output.innerHTML += '<p style="color: green">Connected!</p>';
                
                // Send a test message
                const testMsg = {
                    Register: {
                        request_id: crypto.randomUUID(),
                        server_addr: '127.0.0.1:12349',
                        full_name: 'Test User',
                        username: 'testuser',
                        proposed_password: Array.from(new TextEncoder().encode('test123')),
                        connect_after_register: true,
                        session_security_settings: {
                            security_level: 'Standard',
                            secrecy_mode: 'BestEffort',
                            crypto_params: {
                                encryption_algorithm: 'AES_GCM_256',
                                kem_algorithm: 'Kyber',
                                sig_algorithm: 'None'
                            },
                            header_obfuscator_settings: 'Disabled'
                        },
                        server_password: null
                    }
                };
                
                output.innerHTML += '<p>Sending register request...</p>';
                ws.send(JSON.stringify(testMsg));
            };
            
            ws.onerror = function(error) {
                output.innerHTML += '<p style="color: red">Error: ' + error + '</p>';
            };
            
            ws.onmessage = function(event) {
                output.innerHTML += '<p>Received: ' + event.data + '</p>';
            };
            
            ws.onclose = function() {
                output.innerHTML += '<p style="color: orange">Connection closed</p>';
            };
        }
    </script>
</body>
</html>
