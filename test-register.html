<!DOCTYPE html>
<html>
<head>
    <title>Test Registration</title>
</head>
<body>
    <h1>Test Registration</h1>
    <button id="testBtn">Test Register</button>
    <pre id="output"></pre>
    
    <script type="module">
        // Import websocket service
        import { websocketService } from './src/lib/websocket-service.ts';
        
        const output = document.getElementById('output');
        
        function log(msg) {
            console.log(msg);
            output.textContent += msg + '\n';
        }
        
        document.getElementById('testBtn').addEventListener('click', async () => {
            try {
                log('Initializing WebSocket service...');
                await websocketService.init();
                log('WebSocket service initialized');
                
                log('Calling register...');
                await websocketService.register(
                    'testuser',
                    'testpass123',
                    'Test User',
                    {
                        securityLevel: "Standard",
                        secrecyMode: "BestEffort",
                        encryptionAlgorithm: "AES_GCM_256",
                        kemAlgorithm: "Kyber",
                        sigAlgorithm: "None",
                        headerObfuscatorSettings: {}
                    }
                );
                log('Register called successfully');
            } catch (error) {
                log('Error: ' + error.message);
                console.error('Full error:', error);
            }
        });
    </script>
</body>
</html>
