<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citadel Workspaces</title>

  <body>
    <div id="root"></div>
    <!--
      window.wasmDebugLog is installed by setupWasmDebugBridge() in
      src/lib/wasm-debug-bridge.ts, which doInit() calls as its first action -
      before the WASM client is created, so it is always in place before any
      WASM code can call it. Do not re-add an inline definition here: production
      CSP is script-src 'self' 'wasm-unsafe-eval' with no 'unsafe-inline' (see
      docker/ui/nginx.conf.template in the parent repo), so an inline script in
      this file cannot run in a shipped build. Debug wiring belongs in modules.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
