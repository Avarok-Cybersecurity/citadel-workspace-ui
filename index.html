<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Citadel Workspace — Post-Quantum Secure Collaboration</title>
    <meta
      name="description"
      content="Citadel is a post-quantum secure, peer-to-peer collaborative workspace. Chat, share files and edit documents together over end-to-end encrypted connections built on lattice-based cryptography."
    />
    <meta name="author" content="Avarok Cybersecurity" />
    <link rel="canonical" href="https://citadel.avarok.net/" />
    <meta name="robots" content="index, follow" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Citadel Workspace" />
    <meta property="og:title" content="Citadel Workspace — Post-Quantum Secure Collaboration" />
    <meta
      property="og:description"
      content="A post-quantum secure, peer-to-peer collaborative workspace. End-to-end encrypted chat, file sharing and live documents."
    />
    <meta property="og:url" content="https://citadel.avarok.net/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:alt" content="The Citadel Workspace landing page" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Citadel Workspace — Post-Quantum Secure Collaboration" />
    <meta
      name="twitter:description"
      content="A post-quantum secure, peer-to-peer collaborative workspace. End-to-end encrypted chat, file sharing and live documents."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!--
      The landing hero is a CSS background, so the browser cannot discover it until
      it has downloaded and parsed the stylesheet AND laid out the element that
      references it. That late discovery made it the Largest Contentful Paint.
      Preloading hoists the request to the start of the page load.
    -->
    <link rel="preload" as="image" href="/backgrounds/landing-hero.webp" fetchpriority="high" />

    <!-- PWA. The <link rel="manifest"> is injected by vite-plugin-pwa at build time.
         theme-color drives the OS titlebar/status bar of the installed window. -->
    <meta name="theme-color" content="#6E59A5" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Retained alongside the standard name above: older iOS Safari only honours
         the apple- prefixed form. Chrome logs the apple- one as deprecated. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Citadel" />

    <!--
      Structured data. This is a single-page app behind an authentication wall, so
      the landing page is the only indexable surface; describing it as a
      SoftwareApplication is what lets a search result show more than a title and
      a snippet.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Citadel Workspace",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "A post-quantum secure, peer-to-peer collaborative workspace with end-to-end encrypted chat, file sharing and live documents.",
        "publisher": {
          "@type": "Organization",
          "name": "Avarok Cybersecurity",
          "url": "https://avarok.net/"
        },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!--
      window.wasmDebugLog is installed by setupWasmDebugBridge() in
      src/lib/wasm-debug-bridge.ts, which doInit() calls as its first action -
      before the WASM client is created, so it is always in place before any
      WASM code can call it. Do not re-add an inline definition here: production
      CSP is script-src 'self' 'wasm-unsafe-eval' with no 'unsafe-inline' (see
      docker/ui/nginx.conf.template in the parent repo), so an inline script in
      this file cannot run in a shipped build. Debug wiring belongs in modules.

      The JSON-LD block above is exempt: it is type application/ld+json, which is
      data rather than an executable script, and CSP's script-src does not apply.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
