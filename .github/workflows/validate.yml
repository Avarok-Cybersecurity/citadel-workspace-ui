name: Validate PR

on:
  pull_request:
  push:
    # This repo's default branch is `master`. This said `main`, which does not exist
    # here, alongside a feature branch that has since been deleted -- so a push to the
    # default branch ran NOTHING, and only pull_request events were ever validated.
    branches: ["master"]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PARENT_REPO: Avarok-Cybersecurity/citadel-workspace
  # The FALLBACK parent revision, used only when the parent has no branch matching the
  # one under test here — see the `parent-ref` job, which does the resolving.
  #
  # It tracks the parent's default branch. It was once pinned to a feature branch
  # ('u64-to-bigint-optimization', later 'misc-fixes'), so this submodule's CI validated
  # against whatever that branch happened to contain — which drifts, and eventually
  # stops existing. A check here is only meaningful against the parent revision this
  # code will actually be integrated into.
  PARENT_BRANCH: master
  SKIP_WASM_BUILD: "1"
  # Match parent repo's directory name so docker containers get expected names
  # (e.g., citadel-workspace-server-1 instead of parent-server-1)
  COMPOSE_PROJECT_NAME: citadel-workspace

jobs:
  # Which revision of the parent supplies this repo's build layout and gate scripts.
  #
  # Pinning this to the parent's default branch makes a coordinated change across the
  # two repos UNMERGEABLE. The parent's 250-line gate, for instance, carries an
  # allowance table keyed to THIS repo's files, and that table cannot describe the old
  # and the new file lengths at once. So this repo could not go green until the parent
  # merged the new table, and the parent could not go green until it pinned the new
  # files: each waiting on the other, with no merge order that works.
  #
  # Preferring a parent branch of the SAME NAME breaks the cycle -- the two halves of
  # one change validate against each other -- and anything with no counterpart branch
  # falls back to the default exactly as before.
  parent-ref:
    name: Resolve parent ref
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        env:
          # Passed as environment, never interpolated into the script body: the branch
          # name is attacker-controlled on a fork PR, and an expression expanded inside
          # `run` is a shell-injection sink.
          CANDIDATE: ${{ github.head_ref || github.ref_name }}
          FALLBACK: ${{ env.PARENT_BRANCH }}
          PARENT: ${{ env.PARENT_REPO }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="$FALLBACK"
          if [ -n "${CANDIDATE:-}" ] && gh api "repos/$PARENT/branches/$CANDIDATE" >/dev/null 2>&1; then
            ref="$CANDIDATE"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Parent $PARENT will be checked out at '$ref' (branch under test: '${CANDIDATE:-none}', fallback: '$FALLBACK')."

  unit-tests:
    needs: parent-ref
    name: Unit Tests
    # Observed the same work as the parent job, 6m there; this bounds a hang, not performance.
    # Without it a stuck job holds a runner for GitHub's 360-minute default.
    timeout-minutes: 25
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parent
    steps:
      - name: Checkout parent repo (workspace structure)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARENT_REPO }}
          ref: ${{ needs.parent-ref.outputs.ref }}
          path: parent
      - name: Checkout submodule code (this PR)
        uses: actions/checkout@v4
        with:
          path: parent/citadel-workspaces
      - name: Init citadel-internal-service submodule
        run: git submodule update --init --recursive citadel-internal-service
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Workspace Dependencies
        run: npm ci
      - name: Build citadel-internal-service typescript-client
        run: npm run build
        working-directory: parent/citadel-internal-service/typescript-client
      - name: Build citadel-workspace-client-ts
        run: npm run build
        working-directory: parent/citadel-workspace-client-ts
      - name: Run Unit Tests
        # No `npm install vitest@...` before this. There used to be one, and it
        # pinned 3.0.7 over the root lockfile's 3.2.7 -- so CI ran a different
        # test runner from every developer and from the committed lock, while
        # both logs say only "vitest". A behaviour difference between those
        # versions reads as "passes locally, fails in CI" with the version never
        # suspected.
        #
        # It is not needed: `npm ci` at the parent root hoists vitest to
        # `node_modules/vitest`, and `npx vitest` resolves it from there. The two
        # build steps above are bare `tsc` and touch no install, so nothing was
        # being compensated for -- worth checking, because removing a redundant
        # install in this repository previously broke three jobs with exit 127,
        # and the thing it had been compensating for was a nested `npm ci`.
        #
        # The parent enforces this with scripts/check-ci-installs-match-the-lockfile.mjs.
        run: npx vitest run
        working-directory: parent/citadel-workspaces

  typecheck:
    needs: parent-ref
    name: TypeScript Type Check - ${{ matrix.project }}
    # Observed the same work as the parent job, under a minute there; this bounds a hang, not performance.
    # Without it a stuck job holds a runner for GitHub's 360-minute default.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: citadel-workspaces
            path: citadel-workspaces
          - project: integration-tests
            path: citadel-workspaces/integration-tests
    defaults:
      run:
        working-directory: parent
    steps:
      - name: Checkout parent repo (workspace structure)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARENT_REPO }}
          ref: ${{ needs.parent-ref.outputs.ref }}
          path: parent
      - name: Checkout submodule code (this PR)
        uses: actions/checkout@v4
        with:
          path: parent/citadel-workspaces
      - name: Init citadel-internal-service submodule
        run: git submodule update --init --recursive citadel-internal-service
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Workspace Dependencies
        run: npm ci
      - name: Build citadel-internal-service typescript-client
        run: npm run build
        working-directory: parent/citadel-internal-service/typescript-client
      - name: Build citadel-workspace-client-ts
        run: npm run build
        working-directory: parent/citadel-workspace-client-ts
      - name: Run Type Check
        run: |
          if [ "${{ matrix.project }}" = "citadel-workspaces" ]; then
            npx tsc -p ${{ matrix.path }}/tsconfig.app.json --noEmit
          elif [ "${{ matrix.project }}" = "integration-tests" ]; then
            mkdir -p ${{ matrix.path }}/node_modules
            ln -sf ${{ github.workspace }}/parent/node_modules/playwright ${{ matrix.path }}/node_modules/playwright
            npm run typecheck -w cw-integration-tests
          fi
      # These gates lived ONLY in the parent repo's workflow, so a PR opened
      # against this repository — which is where essentially all UI work happens
      # — could regress the installable PWA, the offline shell, the
      # accessibility score or the landing critical path with nothing noticing.
      # Each one fails silently in production: a broken manifest field simply
      # stops the browser offering to install, and a chunk pulled onto the first
      # paint is invisible until someone measures.
      # WITHOUT THIS, EVERY GATE BELOW FAILS BEFORE IT MEASURES ANYTHING.
      #
      # They all begin with `vite build`, and that build embeds the wasm-pack
      # glue `citadel_internal_service_wasm_client.js`, which is NOT git-tracked
      # (typescript-client/.gitignore:13). It is produced by the
      # `sync-wasm-client` one-shot container in docker-compose.yml.
      #
      # The gates were copied here from the parent repo's workflow without the
      # step that pays for their input, so `vite build` died with
      # "Could not resolve ../citadel_internal_service_wasm_client.js" and named
      # the importer rather than the cause. The parent's own comment warns about
      # exactly this -- it puts these gates in the job that generates the
      # artefacts, "not in the typecheck matrix", because there it does not
      # exist. This job IS the typecheck matrix, so it has to generate them.
      # A base-image manifest pull happens before any RUN, so the retry gate on
      # RUN fetches cannot see it. A 502 from registry-1.docker.io resolving
      # `FROM rust:...` kills the job with no test signal -- the exact shape
      # check-base-image-pulls-retry.mjs exists to prevent, and it caught the
      # step below being added without this one.
      #
      # No step-level `working-directory`, so this runs in the job default
      # `parent`, where the parent repo's scripts/ lives. The two older
      # pre-pull steps in this file say `../scripts/` because they override the
      # directory to parent/citadel-workspaces; copying their path here would
      # have looked right and resolved to nothing.
      - name: Pull base images (retried)
        if: matrix.project == 'citadel-workspaces'
        run: ./scripts/pull-base-images.sh

      - name: Generate WASM artifacts (required for the production build)
        if: matrix.project == 'citadel-workspaces'
        env:
          WORKSPACE_MASTER_PASSWORD: 'ci-prod-build'
          INTERNAL_SERVICE_PORT: '12345'
        run: docker compose up --build sync-wasm-client

      # sync-wasm-client runs as root and bind-mounts this tree read-write. It
      # runs a Vite build of its own, so it leaves `citadel-workspaces/dist/`
      # owned by root -- and the next step's `vite build` runs as `runner` and
      # cannot write into it:
      #
      #   Unable to write the service worker file.
      #   'EACCES: permission denied, open .../citadel-workspaces/dist/sw.js.map'
      #
      # Removing rather than chowning: `dist/` is build output with no inputs in
      # it, the next step regenerates it entirely, and a chown would leave a
      # half-root tree if the container's layout ever changes. The container
      # writing into a host tree is the same hazard that has poisoned
      # `node_modules` here before; this bounds it to one directory.
      #
      # The path is relative to the job's `defaults.run.working-directory:
      # parent`, NOT to the workspace root -- the opposite of the step-level
      # `working-directory:` rule two steps up. The first version of this step
      # said `parent/citadel-workspaces/dist`, which resolved to
      # `parent/parent/...`; `rm -rf` on a path that does not exist succeeds
      # silently, so the step went green and the EACCES came back unchanged.
      # A cleanup that cannot fail is the same defect as a gate that cannot
      # fail, so this one verifies the directory is gone.
      - name: Reclaim the tree the WASM container wrote into
        if: matrix.project == 'citadel-workspaces'
        run: |
          sudo rm -rf citadel-workspaces/dist
          if [ -e citadel-workspaces/dist ]; then
            echo "::error::citadel-workspaces/dist still exists after removal"
            exit 1
          fi
          echo "reclaimed: citadel-workspaces/dist is gone"

      - name: Landing bundle budget
        if: matrix.project == 'citadel-workspaces'
        run: npm run build && npm run check:bundle
        working-directory: parent/citadel-workspaces

      - name: Source maps
        # Runs here because it reads dist/, which the bundle-budget step above
        # has just built. It had an npm script and no CI invocation, so it had
        # never run anywhere.
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:sourcemaps
        working-directory: parent/citadel-workspaces

      - name: PWA installability
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:pwa
        working-directory: parent/citadel-workspaces

      - name: Lighthouse baselines
        # Accessibility and SEO are held at 100 because they are rule checks, not
        # measurements. Performance has a loose floor: a shared runner is slower
        # and noisier than a laptop, and a flaky gate is worse than no gate
        # because people learn to re-run it without reading it.
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:lighthouse
        working-directory: parent/citadel-workspaces

      - name: Install Chromium for the offline check
        if: matrix.project == 'citadel-workspaces'
        # Retried, and each attempt bounded. The parent repo's copy of this step
        # stalled for 55 minutes in run 33300992291 and was killed by the job
        # budget without running a test -- a CDN fetch with no retry and no
        # timeout of its own. npm retries its own fetches; this download does
        # not, which is why it is the one that hangs.
        run: |
          # `--with-deps` shells out to apt-get, and unattended-upgrades holds
          # /var/lib/dpkg/lock-frontend for minutes after boot, so every attempt
          # dies with exit 100. Retrying into a held lock does not help; waiting
          # for the lock does.
          wait_for_apt_lock() {
            command -v fuser >/dev/null 2>&1 || { sleep 30; return 0; }
            waited=0
            while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
              if [ "$waited" -ge 300 ]; then
                echo "dpkg lock still held after 5m; attempting anyway"
                return 0
              fi
              echo "waiting for the dpkg lock (${waited}s elapsed)"
              sleep 10
              waited=$((waited + 10))
            done
          }
          wait_for_apt_lock
          attempt=1
          wait_for_apt_lock
          until timeout 600 npx playwright install --with-deps chromium; do
            if [ "$attempt" -ge 3 ]; then
              echo "playwright install still failing after 3 attempts"
              exit 1
            fi
            echo "playwright install failed or stalled (attempt $attempt/3); retrying"
            attempt=$((attempt + 1))
            sleep $((attempt * 15))
            wait_for_apt_lock
          done
        working-directory: parent/citadel-workspaces

      - name: PWA offline behaviour
        # The app tells the user it will load without a connection. Nothing
        # verified that promise until this: a precache that stopped covering the
        # shell would leave an installed app opening to a blank page offline.
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:pwa-offline
        working-directory: parent/citadel-workspaces

      - name: PWA update flow
        # The upgrade half of the lifecycle, and the half that fails silently:
        # an installed worker keeps serving its cached bundle by design, so a
        # broken update path produces no error and no complaint — the app just
        # stops changing. The unit test beside PwaUpdatePrompt mocks the
        # register hook, proving the component reacts to needRefresh but never
        # that anything sets it.
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:pwa-update
        working-directory: parent/citadel-workspaces

      - name: Reduced motion
        # Neither axe nor Lighthouse reports motion, so ninety of the app's
        # hundred animations opted out of prefers-reduced-motion unnoticed.
        # Also checks that suppressing motion did not suppress the dialogs the
        # motion was attached to — a failure only reduced-motion users would see.
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:reduced-motion
        working-directory: parent/citadel-workspaces

      - name: Mobile layout
        # axe measures colour, names and roles — not size. Three controls
        # shipped under the WCAG 2.2 24px target floor, including the close
        # button on every dialog in the app, with every a11y gate green.
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:mobile
        working-directory: parent/citadel-workspaces

      # Delegates to the parent repo's gate rather than reimplementing it.
      #
      # This step carried its own bash copy of the 250-line rule with its own
      # SKIP_FILES list, and the two drifted: `lib/connection/service.ts` is
      # 252 lines and is recorded in scripts/check-file-length.mjs as a held
      # exception, but was absent from the list here -- so this repo failed a
      # file the parent passes, on a rule both are supposed to enforce.
      #
      # The parent's version is also the stricter one: it pins each exception
      # to an EXACT line count (`['lib/connection/service.ts', 252]`), so a
      # held file cannot quietly grow, where a name-only skip list lets it
      # grow forever. Two implementations of one rule drift toward the weaker.
      - name: Enforce 250-line file limit
        if: matrix.project == 'citadel-workspaces'
        run: node scripts/check-file-length.mjs

  lint:
    needs: parent-ref
    name: ESLint - ${{ matrix.project }}
    # Observed the same work as the parent job, 1m there; this bounds a hang, not performance.
    # Without it a stuck job holds a runner for GitHub's 360-minute default.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: citadel-workspaces
            path: citadel-workspaces
          - project: integration-tests
            path: citadel-workspaces/integration-tests
    defaults:
      run:
        working-directory: parent
    steps:
      - name: Checkout parent repo (workspace structure)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARENT_REPO }}
          ref: ${{ needs.parent-ref.outputs.ref }}
          path: parent
      - name: Checkout submodule code (this PR)
        uses: actions/checkout@v4
        with:
          path: parent/citadel-workspaces
      - name: Init citadel-internal-service submodule
        run: git submodule update --init --recursive citadel-internal-service
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Workspace Dependencies
        run: npm ci
      - name: Build citadel-internal-service typescript-client
        # A bare build, matching the unit-tests and typecheck jobs above.
        #
        # This alone said `npm ci && npm run build`. `citadel-internal-service/
        # typescript-client` is a member of the ROOT npm workspace, so that nested
        # install re-resolved it from its own tracked lockfile -- which pins uuid
        # 9.0.1 and ws 8.18.3 against the root's 13.0.2 and 8.21.3 -- and unhoisted
        # the root's devDependencies on the way past.
        #
        # Everything below it existed to undo that: a pinned `npm install
        # eslint@9.39.2` over the lockfile's version, and three `ln -sf` calls
        # putting @eslint/js, globals and typescript-eslint back where node
        # resolution would have found them anyway. All three are gone, because the
        # thing they compensated for is gone. Verified rather than assumed: with a
        # plain root `npm ci` and none of them, the member resolves all four
        # packages from the root and `eslint . --max-warnings 0` exits 0.
        #
        # The parent forbids both patterns -- check-no-nested-npm-ci-in-workspaces
        # and check-ci-runs-lockfile-versions -- but reads only its OWN workflows,
        # so this file was never scanned. docs/ROBUSTNESS.md records deleting this
        # exact `eslint@9.39.2` line from the parent; it survived here.
        run: npm run build
        working-directory: parent/citadel-internal-service/typescript-client
      - name: Build citadel-workspace-client-ts
        run: npm run build
        working-directory: parent/citadel-workspace-client-ts
      - name: Run ESLint
        run: ${{ github.workspace }}/parent/node_modules/.bin/eslint . --max-warnings 0
        working-directory: parent/${{ matrix.path }}

      # Static gates that need no build, no browser and no running stack.
      #
      # `check:spec-copy` had an npm script and NO CI invocation, so it had
      # never run anywhere -- the parent repo has check-every-gate-is-invoked
      # for its own gates and this submodule has no equivalent. Five more
      # (check:event-pairs, :sourcemaps, :a11y, :agent-down, :types,
      # :toast-header) are in the same position but need a build or a browser;
      # they are recorded in docs rather than wired blindly here.
      - name: Every gate is invoked by something
        # check:spec-copy had an npm script, a careful header, and no CI
        # invocation, so it had never run from the day it was written. The
        # parent repo has had this check since the same thing happened there.
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:gates-invoked
        working-directory: parent/citadel-workspaces

      - name: Every event has an emitter and a listener
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:event-pairs
        working-directory: parent/citadel-workspaces

      - name: Spec locators match real app copy
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:spec-copy
        working-directory: parent/citadel-workspaces
      - name: Debug log arguments are cheap
        # debugLog is a noop in production but its ARGUMENTS are still
        # evaluated: one site hashed every byte of every inbound P2P message
        # for a logger that discards it.
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:debug-args
        working-directory: parent/citadel-workspaces

      - name: A captured console line is not automatically a failure
        # The reconnection specs capture `'ILM'` on purpose -- a delivery failure
        # with no ILM lines has nothing to diagnose from -- and four of the five
        # then reused that list to decide what was an error, so every
        # informational router line became a critical UX failure.
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:captured-vs-failed
        working-directory: parent/citadel-workspaces

      - name: Parent checkouts all take the resolved ref
        # Five jobs check the parent out to run ITS gate scripts against this PR.
        # While that ref was hardcoded to the parent's default branch, a change
        # spanning both repos could not be merged in either order. A sixth site
        # added later with the old form would be silent: the job passes, against
        # the wrong parent revision.
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:parent-ref
        working-directory: parent/citadel-workspaces

  playwright-tests:
    needs: parent-ref
    # The @playwright/test suite under integration-tests/src/tests-pw, which ran in
    # no job at all — those specs were compiled by the typecheck job and then never
    # executed against a running stack. Sharded rather than one job per spec, so
    # adding a spec needs no matrix edit. Mirrors the parent repo's job.
    name: Playwright - shard ${{ matrix.shard }}
    # Observed the same work as the parent job, 41m there; this bounds a hang, not performance.
    # Without it a stuck job holds a runner for GitHub's 360-minute default.
    timeout-minutes: 80
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: parent
    steps:
      - name: Checkout parent repo (workspace structure)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARENT_REPO }}
          ref: ${{ needs.parent-ref.outputs.ref }}
          path: parent
      - name: Checkout submodule code (this PR)
        uses: actions/checkout@v4
        with:
          path: parent/citadel-workspaces
      - name: Init citadel-internal-service submodule
        run: git submodule update --init --recursive citadel-internal-service
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          # Best effort: this frees cache, it does not build anything. apt takes a
          # lock, and unattended-upgrades holds one for minutes after boot — the
          # failure that killed test:crud in this same workflow. A cleanup that
          # cannot run is not a reason to fail the build. Preventive: no run has
          # failed here, but the mechanism is one already proven live in this file.
          sudo apt-get clean || echo 'apt-get clean skipped (lock held)'
          df -h
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        # Root install first, and before `playwright install` — see the long note
        # on the integration-tests job for why both orderings matter.
        run: npm ci
      - name: Install Playwright Browsers
        # Retried, and each attempt bounded. The parent repo's copy of this step
        # stalled for 55 minutes in run 33300992291 and was killed by the job
        # budget without running a test -- a CDN fetch with no retry and no
        # timeout of its own. npm retries its own fetches; this download does
        # not, which is why it is the one that hangs.
        run: |
          # Wait for apt before asking playwright to use it.
          #
          # `--with-deps` shells out to apt-get, and the runner image's
          # unattended-upgrades holds /var/lib/dpkg/lock-frontend for minutes
          # after boot. Every attempt then dies on
          #   E: Could not get lock /var/lib/dpkg/lock-frontend.
          #      It is held by process NNNN (apt-get)
          # with exit code 100 — which is not a download failure, so retrying
          # into it does not help. The existing 30s/45s backoff was not the right
          # shape: the wait needed is "until the lock is free", not a guess.
          wait_for_apt_lock() {
            command -v fuser >/dev/null 2>&1 || { sleep 30; return 0; }
            waited=0
            while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
              if [ "$waited" -ge 300 ]; then
                echo "dpkg lock still held after 5m; attempting anyway"
                return 0
              fi
              echo "waiting for the dpkg lock (${waited}s elapsed)"
              sleep 10
              waited=$((waited + 10))
            done
          }
          attempt=1
          wait_for_apt_lock
          until timeout 600 npx playwright install chromium --with-deps; do
            if [ "$attempt" -ge 3 ]; then
              echo "playwright install still failing after 3 attempts"
              exit 1
            fi
            echo "playwright install failed or stalled (attempt $attempt/3); retrying"
            attempt=$((attempt + 1))
            sleep $((attempt * 15))
            wait_for_apt_lock
          done
      - name: Symlink workspace deps for integration-tests
        run: |
          mkdir -p citadel-workspaces/integration-tests/node_modules
          ln -sf ${{ github.workspace }}/parent/node_modules/playwright \
                 citadel-workspaces/integration-tests/node_modules/playwright
          ln -sf ${{ github.workspace }}/parent/node_modules/@playwright \
                 citadel-workspaces/integration-tests/node_modules/@playwright
      - name: Pull base images (retried)
        # A base-image manifest pull is a network fetch that happens before any
        # RUN, so the retry gate on RUN fetches cannot see it. A run died on a
        # 502 from registry-1.docker.io resolving `FROM rust:1.92.0` and took
        # test:tree-permissions with it -- a red job with no test signal, the
        # same shape as the failure that gate was written for.
        run: ../scripts/pull-base-images.sh
        # Step-level working-directory is relative to the WORKSPACE ROOT, not to
        # the job's `defaults.run.working-directory: parent`. Without the prefix
        # this named a path that does not exist here and the step died with
        # "No such file or directory" before running anything -- a red job with
        # no signal about the thing it was meant to test.
        working-directory: parent/citadel-workspaces
      - name: Start Services
        env:
          INTERNAL_SERVICE_PORT: '12345'
          WORKSPACE_MASTER_PASSWORD: 'ci-test-password'
        run: docker compose up -d --build --wait
      - name: Dump Service Logs on Start Failure
        if: failure()
        run: |
          docker compose logs sync-wasm-client 2>&1 | tail -200
          docker compose logs server 2>&1 | tail -50
          docker compose logs internal-service 2>&1 | tail -50
      - name: Clean Docker Build Cache
        run: |
          docker builder prune -af
          docker image prune -af
          df -h
      - name: Run Playwright Tests
        env:
          IN_CI: 'true'
          WORKSPACE_MASTER_PASSWORD: 'ci-test-password'
          INTERNAL_SERVICE_PORT: '12345'
        run: npx playwright test --shard=${{ matrix.shard }}/3
        working-directory: parent/citadel-workspaces/integration-tests
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            parent/citadel-workspaces/integration-tests/playwright-report/
            parent/citadel-workspaces/integration-tests/test-results/

  integration-tests:
    needs: parent-ref
    name: Integration Test - ${{ matrix.test }}
    # Observed the same work as the parent job, 26m there; this bounds a hang, not performance.
    # Without it a stuck job holds a runner for GitHub's 360-minute default.
    timeout-minutes: 55
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: test:p2p
            artifact: p2p
          - test: test:live-doc
            artifact: live-doc
          - test: test:group
            artifact: group
          - test: test:group-multiuser
            artifact: group-multiuser
          - test: test:crud
            artifact: crud
          - test: test:prev-sessions
            artifact: prev-sessions
          - test: test:file-transfer
            artifact: file-transfer
          - test: test:offline
            artifact: offline
          - test: test:hard-disconnect
            artifact: hard-disconnect
          - test: test:permissions
            artifact: permissions
          - test: test:admin-modal
            artifact: admin-modal
          - test: test:security
            artifact: security
          - test: test:topbar
            artifact: topbar
          - test: test:p2p-types
            artifact: p2p-types
          - test: test:settings-controls
            artifact: settings-controls
          - test: test:directory-actions
            artifact: directory-actions
          - test: test:member-mgmt
            artifact: member-mgmt
          - test: test:group-extended
            artifact: group-extended
          - test: test:files-extended
            artifact: files-extended
          - test: test:mdx-content
            artifact: mdx-content
          - test: test:misc
            artifact: misc
          - test: test:account-mgmt
            artifact: account-mgmt
          - test: test:hierarchy-nav
            artifact: hierarchy-nav
          # Previously missing from CI matrix
          - test: test:settings
            artifact: settings
          - test: test:directory
            artifact: directory
          - test: test:workspace-init
            artifact: workspace-init
          - test: test:notifications
            artifact: notifications
          - test: test:tree-structure
            artifact: tree-structure
          - test: test:chat-settings
            artifact: chat-settings
          - test: test:reconnect-c2s
            artifact: reconnect-c2s
          - test: test:reconnect-both-c2s
            artifact: reconnect-both-c2s
          - test: test:reconnect-one-c2s
            artifact: reconnect-one-c2s
          - test: test:reconnect-p2p-one-c2s
            artifact: reconnect-p2p-one-c2s
          - test: test:reconnect-p2p-only
            artifact: reconnect-p2p-only
          - test: test:file-manager
            artifact: file-manager
          - test: test:native-file-picker
            artifact: native-file-picker
          - test: test:office-chat
            artifact: office-chat
          - test: test:peer-group
            artifact: peer-group
          - test: test:revfs:peer
            artifact: revfs-peer
          - test: test:revfs:server
            artifact: revfs-server
          - test: test:room-chat
            artifact: room-chat
          - test: test:tree-cascade
            artifact: tree-cascade
          - test: test:tree-custom-types
            artifact: tree-custom-types
          - test: test:tree-deep
            artifact: tree-deep
          - test: test:tree-move
            artifact: tree-move
          - test: test:tree-permissions
            artifact: tree-permissions
          - test: test:tree-validator
            artifact: tree-validator
    defaults:
      run:
        working-directory: parent
    steps:
      - name: Checkout parent repo (workspace structure)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARENT_REPO }}
          ref: ${{ needs.parent-ref.outputs.ref }}
          path: parent
      - name: Checkout submodule code (this PR)
        uses: actions/checkout@v4
        with:
          path: parent/citadel-workspaces
      - name: Init citadel-internal-service submodule
        run: git submodule update --init --recursive citadel-internal-service
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          # Best effort: this frees cache, it does not build anything. apt takes a
          # lock, and unattended-upgrades holds one for minutes after boot — the
          # failure that killed test:crud in this same workflow. A cleanup that
          # cannot run is not a reason to fail the build. Preventive: no run has
          # failed here, but the mechanism is one already proven live in this file.
          sudo apt-get clean || echo 'apt-get clean skipped (lock held)'
          df -h
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        # `npm ci` at the workspace root hoists playwright once, instead
        # of installing it both at root AND in citadel-workspaces/. Two
        # copies caused `tsc` to see two distinct
        # `playwright-core/types/types` locations and reject the test
        # build with "Type X/Browser is not assignable to type Y/Browser"
        # plus `Property 'toBeVisible' does not exist`. One hoisted copy
        # makes module resolution coherent. Mirrors the equivalent fix in
        # the parent repo's validate.yml.
        #
        # IMPORTANT: install deps BEFORE `playwright install`. Running
        # `npx playwright install` first triggers npx to auto-fetch the
        # *latest* playwright, which downloads chrome-headless-shell for
        # a different version than the locked one. The test then fails
        # with "Executable doesn't exist at .../chromium_headless_shell-<v>"
        # because the installed binary version doesn't match the one
        # playwright@locked-version expects.
        run: npm ci
      - name: Install Playwright Browsers
        # Now that deps are installed, this resolves to the locked
        # version's `playwright install` and downloads the matching
        # chromium build.
        # Retried, and each attempt bounded. The parent repo's copy of this step
        # stalled for 55 minutes in run 33300992291 and was killed by the job
        # budget without running a test -- a CDN fetch with no retry and no
        # timeout of its own. npm retries its own fetches; this download does
        # not, which is why it is the one that hangs.
        run: |
          # Wait for apt before asking playwright to use it.
          #
          # `--with-deps` shells out to apt-get, and the runner image's
          # unattended-upgrades holds /var/lib/dpkg/lock-frontend for minutes
          # after boot. Every attempt then dies on
          #   E: Could not get lock /var/lib/dpkg/lock-frontend.
          #      It is held by process NNNN (apt-get)
          # with exit code 100 — which is not a download failure, so retrying
          # into it does not help. The existing 30s/45s backoff was not the right
          # shape: the wait needed is "until the lock is free", not a guess.
          wait_for_apt_lock() {
            command -v fuser >/dev/null 2>&1 || { sleep 30; return 0; }
            waited=0
            while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
              if [ "$waited" -ge 300 ]; then
                echo "dpkg lock still held after 5m; attempting anyway"
                return 0
              fi
              echo "waiting for the dpkg lock (${waited}s elapsed)"
              sleep 10
              waited=$((waited + 10))
            done
          }
          attempt=1
          wait_for_apt_lock
          until timeout 600 npx playwright install chromium --with-deps; do
            if [ "$attempt" -ge 3 ]; then
              echo "playwright install still failing after 3 attempts"
              exit 1
            fi
            echo "playwright install failed or stalled (attempt $attempt/3); retrying"
            attempt=$((attempt + 1))
            sleep $((attempt * 15))
            wait_for_apt_lock
          done
      - name: Symlink workspace deps for integration-tests build
        # `tsc` in integration-tests walks node_modules up the tree
        # (NodeNext). Symlinking playwright from the workspace-root
        # node_modules into integration-tests guarantees closest-
        # resolution lands on the single hoisted copy.
        run: |
          mkdir -p citadel-workspaces/integration-tests/node_modules
          ln -sf ${{ github.workspace }}/parent/node_modules/playwright \
                 citadel-workspaces/integration-tests/node_modules/playwright
          ln -sf ${{ github.workspace }}/parent/node_modules/@playwright \
                 citadel-workspaces/integration-tests/node_modules/@playwright
      - name: Pull base images (retried)
        # A base-image manifest pull is a network fetch that happens before any
        # RUN, so the retry gate on RUN fetches cannot see it. A run died on a
        # 502 from registry-1.docker.io resolving `FROM rust:1.92.0` and took
        # test:tree-permissions with it -- a red job with no test signal, the
        # same shape as the failure that gate was written for.
        run: ../scripts/pull-base-images.sh
        # Step-level working-directory is relative to the WORKSPACE ROOT, not to
        # the job's `defaults.run.working-directory: parent`. Without the prefix
        # this named a path that does not exist here and the step died with
        # "No such file or directory" before running anything -- a red job with
        # no signal about the thing it was meant to test.
        working-directory: parent/citadel-workspaces
      - name: Start Services
        env:
          INTERNAL_SERVICE_PORT: '12345'
          WORKSPACE_MASTER_PASSWORD: 'ci-test-password'
        run: docker compose up -d --build --wait
      - name: Dump Service Logs on Start Failure
        if: failure()
        run: |
          echo "=== sync-wasm-client logs ==="
          docker compose logs sync-wasm-client 2>&1 | tail -200
          echo "=== server logs ==="
          docker compose logs server 2>&1 | tail -50
          echo "=== internal-service logs ==="
          docker compose logs internal-service 2>&1 | tail -50
      - name: Clean Docker Build Cache
        run: |
          docker builder prune -af
          docker image prune -af
          df -h
      - name: Run Integration Test
        env:
          IN_CI: 'true'
          WORKSPACE_MASTER_PASSWORD: 'ci-test-password'
          # Several tests call `restartBackendServices` which spawns
          # `docker compose` from the test runner; without
          # INTERNAL_SERVICE_PORT in scope, docker-compose.yml's
          # `${INTERNAL_SERVICE_PORT:-12345}` works at the compose
          # level but the test runner's docker compose invocations
          # would log a warning and (pre-fallback) bake an empty
          # `--bind '0.0.0.0:'` into the container. Set it here so
          # the runner inherits the same value Start Services used.
          INTERNAL_SERVICE_PORT: '12345'
        run: npm run ${{ matrix.test }}
        working-directory: parent/citadel-workspaces/integration-tests
      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.artifact }}
          path: parent/citadel-workspaces/integration-tests/screenshots/
      - name: Upload Trace and Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.artifact }}
          path: |
            parent/citadel-workspaces/integration-tests/test-results/
            parent/citadel-workspaces/integration-tests/reports/
