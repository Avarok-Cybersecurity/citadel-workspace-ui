name: Validate PR

on:
  pull_request:
  push:
    branches: ["main", "u64-to-bigint-optimization"]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PARENT_REPO: Avarok-Cybersecurity/citadel-workspace
  # `misc-fixes` is the parent's currently-active integration branch and
  # the only one whose package-lock.json knows about every dep this
  # submodule's package.json files declare (notably @playwright/test in
  # integration-tests). The previous `u64-to-bigint-optimization`
  # baseline pre-dated several workspace deps, which made `npm ci`
  # fail at the parent root and cascaded into ~40 CI failures.
  # Track the parent's default branch. This was pinned to a feature branch
  # ('u64-to-bigint-optimization', later 'misc-fixes'), so this submodule's CI
  # validated against whatever that branch happened to contain — which drifts,
  # and eventually stops existing. Every check here is only meaningful against
  # the parent revision this code will actually be integrated into.
  PARENT_BRANCH: master
  SKIP_WASM_BUILD: "1"
  # Match parent repo's directory name so docker containers get expected names
  # (e.g., citadel-workspace-server-1 instead of parent-server-1)
  COMPOSE_PROJECT_NAME: citadel-workspace

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parent
    steps:
      - name: Checkout parent repo (workspace structure)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARENT_REPO }}
          ref: ${{ env.PARENT_BRANCH }}
          path: parent
      - name: Checkout submodule code (this PR)
        uses: actions/checkout@v4
        with:
          path: parent/citadel-workspaces
      - name: Init citadel-internal-service submodule
        run: git submodule update --init --recursive citadel-internal-service
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Workspace Dependencies
        run: npm ci
      - name: Build citadel-internal-service typescript-client
        run: npm run build
        working-directory: parent/citadel-internal-service/typescript-client
      - name: Build citadel-workspace-client-ts
        run: npm run build
        working-directory: parent/citadel-workspace-client-ts
      - name: Install Vitest
        run: npm install vitest@3.0.7 --save-dev
      - name: Run Unit Tests
        run: npx vitest run
        working-directory: parent/citadel-workspaces

  typecheck:
    name: TypeScript Type Check - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: citadel-workspaces
            path: citadel-workspaces
          - project: integration-tests
            path: citadel-workspaces/integration-tests
    defaults:
      run:
        working-directory: parent
    steps:
      - name: Checkout parent repo (workspace structure)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARENT_REPO }}
          ref: ${{ env.PARENT_BRANCH }}
          path: parent
      - name: Checkout submodule code (this PR)
        uses: actions/checkout@v4
        with:
          path: parent/citadel-workspaces
      - name: Init citadel-internal-service submodule
        run: git submodule update --init --recursive citadel-internal-service
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Workspace Dependencies
        run: npm ci
      - name: Build citadel-internal-service typescript-client
        run: npm run build
        working-directory: parent/citadel-internal-service/typescript-client
      - name: Build citadel-workspace-client-ts
        run: npm run build
        working-directory: parent/citadel-workspace-client-ts
      - name: Run Type Check
        run: |
          if [ "${{ matrix.project }}" = "citadel-workspaces" ]; then
            npx tsc -p ${{ matrix.path }}/tsconfig.app.json --noEmit
          elif [ "${{ matrix.project }}" = "integration-tests" ]; then
            mkdir -p ${{ matrix.path }}/node_modules
            ln -sf ${{ github.workspace }}/parent/node_modules/playwright ${{ matrix.path }}/node_modules/playwright
            npm run typecheck -w cw-integration-tests
          fi
      # These gates lived ONLY in the parent repo's workflow, so a PR opened
      # against this repository — which is where essentially all UI work happens
      # — could regress the installable PWA, the offline shell, the
      # accessibility score or the landing critical path with nothing noticing.
      # Each one fails silently in production: a broken manifest field simply
      # stops the browser offering to install, and a chunk pulled onto the first
      # paint is invisible until someone measures.
      - name: Landing bundle budget
        if: matrix.project == 'citadel-workspaces'
        run: npm run build && npm run check:bundle
        working-directory: parent/citadel-workspaces

      - name: PWA installability
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:pwa
        working-directory: parent/citadel-workspaces

      - name: Lighthouse baselines
        # Accessibility and SEO are held at 100 because they are rule checks, not
        # measurements. Performance has a loose floor: a shared runner is slower
        # and noisier than a laptop, and a flaky gate is worse than no gate
        # because people learn to re-run it without reading it.
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:lighthouse
        working-directory: parent/citadel-workspaces

      - name: Install Chromium for the offline check
        if: matrix.project == 'citadel-workspaces'
        run: npx playwright install --with-deps chromium
        working-directory: parent/citadel-workspaces

      - name: PWA offline behaviour
        # The app tells the user it will load without a connection. Nothing
        # verified that promise until this: a precache that stopped covering the
        # shell would leave an installed app opening to a blank page offline.
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:pwa-offline
        working-directory: parent/citadel-workspaces

      - name: PWA update flow
        # The upgrade half of the lifecycle, and the half that fails silently:
        # an installed worker keeps serving its cached bundle by design, so a
        # broken update path produces no error and no complaint — the app just
        # stops changing. The unit test beside PwaUpdatePrompt mocks the
        # register hook, proving the component reacts to needRefresh but never
        # that anything sets it.
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:pwa-update
        working-directory: parent/citadel-workspaces

      - name: Reduced motion
        # Neither axe nor Lighthouse reports motion, so ninety of the app's
        # hundred animations opted out of prefers-reduced-motion unnoticed.
        # Also checks that suppressing motion did not suppress the dialogs the
        # motion was attached to — a failure only reduced-motion users would see.
        if: matrix.project == 'citadel-workspaces'
        run: npm run check:reduced-motion
        working-directory: parent/citadel-workspaces

      - name: Enforce 250-line file limit
        if: matrix.project == 'citadel-workspaces'
        run: |
          # Files that pre-date this PR and already exceed the cap.
          # The 250-line rule was introduced after they were written;
          # this PR is not the right place to refactor them. Tracked
          # as known violations so the cap still keeps NEW files in
          # check.
          SKIP_FILES=(
            "components/ui/sidebar.tsx"
            "components/layout/sidebar/TreeNodesSection.tsx"
            "components/p2p/ChatSettingsPanel.tsx"
            "lib/file-transfer/service.ts"
            "pages/Landing.tsx"
            "types/messaging-layer.ts"
            "types/workspace-protocol.ts"
          )

          VIOLATIONS=0
          while IFS= read -r file; do
            rel="${file#citadel-workspaces/src/}"
            skip=false
            for s in "${SKIP_FILES[@]}"; do
              if [ "$rel" = "$s" ]; then skip=true; break; fi
            done
            if $skip; then continue; fi

            lines=$(wc -l < "$file")
            if [ "$lines" -gt 250 ]; then
              echo "::error file=$file::$file has $lines lines (limit: 250)"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          # The path is relative to the job's `defaults.run.working-directory:
          # parent`, where this PR's code is checked out at
          # parent/citadel-workspaces — so `citadel-workspaces/src` is correct
          # here even though no such directory exists at this repo's own root.
          #
          # Tests are excluded deliberately: the cap exists to stop a MODULE
          # accreting responsibilities, while a test file's length measures how
          # many cases it covers, which is the opposite signal.
          done < <(find citadel-workspaces/src -type f \( -name '*.ts' -o -name '*.tsx' \) ! -name '*.bak' ! -path '*/__tests__/*')

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "FAIL: $VIOLATIONS file(s) exceed the 250-line limit"
            exit 1
          fi
          echo "All TypeScript files within 250-line limit"

  lint:
    name: ESLint - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: citadel-workspaces
            path: citadel-workspaces
          - project: integration-tests
            path: citadel-workspaces/integration-tests
    defaults:
      run:
        working-directory: parent
    steps:
      - name: Checkout parent repo (workspace structure)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARENT_REPO }}
          ref: ${{ env.PARENT_BRANCH }}
          path: parent
      - name: Checkout submodule code (this PR)
        uses: actions/checkout@v4
        with:
          path: parent/citadel-workspaces
      - name: Init citadel-internal-service submodule
        run: git submodule update --init --recursive citadel-internal-service
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Workspace Dependencies
        run: npm ci
      - name: Build citadel-internal-service typescript-client
        run: npm ci && npm run build
        working-directory: parent/citadel-internal-service/typescript-client
      - name: Build citadel-workspace-client-ts
        run: npm run build
        working-directory: parent/citadel-workspace-client-ts
      - name: Install ESLint at root (workspaces hoisting issue)
        run: npm install eslint@9.39.2 --save-dev
      - name: Run ESLint
        run: |
          mkdir -p node_modules/@eslint
          ln -sf ${{ github.workspace }}/parent/node_modules/@eslint/js node_modules/@eslint/js
          ln -sf ${{ github.workspace }}/parent/node_modules/globals node_modules/globals
          ln -sf ${{ github.workspace }}/parent/node_modules/typescript-eslint node_modules/typescript-eslint
          ${{ github.workspace }}/parent/node_modules/.bin/eslint . --max-warnings 0
        working-directory: parent/${{ matrix.path }}

  playwright-tests:
    # The @playwright/test suite under integration-tests/src/tests-pw, which ran in
    # no job at all — those specs were compiled by the typecheck job and then never
    # executed against a running stack. Sharded rather than one job per spec, so
    # adding a spec needs no matrix edit. Mirrors the parent repo's job.
    name: Playwright - shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: parent
    steps:
      - name: Checkout parent repo (workspace structure)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARENT_REPO }}
          ref: ${{ env.PARENT_BRANCH }}
          path: parent
      - name: Checkout submodule code (this PR)
        uses: actions/checkout@v4
        with:
          path: parent/citadel-workspaces
      - name: Init citadel-internal-service submodule
        run: git submodule update --init --recursive citadel-internal-service
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        # Root install first, and before `playwright install` — see the long note
        # on the integration-tests job for why both orderings matter.
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
      - name: Symlink workspace deps for integration-tests
        run: |
          mkdir -p citadel-workspaces/integration-tests/node_modules
          ln -sf ${{ github.workspace }}/parent/node_modules/playwright \
                 citadel-workspaces/integration-tests/node_modules/playwright
          ln -sf ${{ github.workspace }}/parent/node_modules/@playwright \
                 citadel-workspaces/integration-tests/node_modules/@playwright
      - name: Start Services
        env:
          INTERNAL_SERVICE_PORT: '12345'
          WORKSPACE_MASTER_PASSWORD: 'ci-test-password'
        run: docker compose up -d --build --wait
      - name: Dump Service Logs on Start Failure
        if: failure()
        run: |
          docker compose logs sync-wasm-client 2>&1 | tail -200
          docker compose logs server 2>&1 | tail -50
          docker compose logs internal-service 2>&1 | tail -50
      - name: Clean Docker Build Cache
        run: |
          docker builder prune -af
          docker image prune -af
          df -h
      - name: Run Playwright Tests
        env:
          IN_CI: 'true'
          WORKSPACE_MASTER_PASSWORD: 'ci-test-password'
          INTERNAL_SERVICE_PORT: '12345'
        run: npx playwright test --shard=${{ matrix.shard }}/3
        working-directory: parent/citadel-workspaces/integration-tests
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            parent/citadel-workspaces/integration-tests/playwright-report/
            parent/citadel-workspaces/integration-tests/test-results/

  integration-tests:
    name: Integration Test - ${{ matrix.test }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: test:p2p
            artifact: p2p
          - test: test:live-doc
            artifact: live-doc
          - test: test:group
            artifact: group
          - test: test:group-multiuser
            artifact: group-multiuser
          - test: test:crud
            artifact: crud
          - test: test:login
            artifact: login
          - test: test:prev-sessions
            artifact: prev-sessions
          - test: test:file-transfer
            artifact: file-transfer
          - test: test:offline
            artifact: offline
          - test: test:hard-disconnect
            artifact: hard-disconnect
          - test: test:permissions
            artifact: permissions
          - test: test:admin-modal
            artifact: admin-modal
          - test: test:security
            artifact: security
          - test: test:topbar
            artifact: topbar
          - test: test:p2p-types
            artifact: p2p-types
          - test: test:settings-controls
            artifact: settings-controls
          - test: test:directory-actions
            artifact: directory-actions
          - test: test:member-mgmt
            artifact: member-mgmt
          - test: test:group-extended
            artifact: group-extended
          - test: test:files-extended
            artifact: files-extended
          - test: test:mdx-content
            artifact: mdx-content
          - test: test:misc
            artifact: misc
          - test: test:account-mgmt
            artifact: account-mgmt
          - test: test:hierarchy-nav
            artifact: hierarchy-nav
          # Previously missing from CI matrix
          - test: test:settings
            artifact: settings
          - test: test:directory
            artifact: directory
          - test: test:workspace-init
            artifact: workspace-init
          - test: test:notifications
            artifact: notifications
          - test: test:tree-structure
            artifact: tree-structure
          - test: test:chat-settings
            artifact: chat-settings
          - test: test:reconnect-c2s
            artifact: reconnect-c2s
          - test: test:reconnect-both-c2s
            artifact: reconnect-both-c2s
          - test: test:reconnect-one-c2s
            artifact: reconnect-one-c2s
          - test: test:reconnect-p2p-one-c2s
            artifact: reconnect-p2p-one-c2s
          - test: test:reconnect-p2p-only
            artifact: reconnect-p2p-only
    defaults:
      run:
        working-directory: parent
    steps:
      - name: Checkout parent repo (workspace structure)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARENT_REPO }}
          ref: ${{ env.PARENT_BRANCH }}
          path: parent
      - name: Checkout submodule code (this PR)
        uses: actions/checkout@v4
        with:
          path: parent/citadel-workspaces
      - name: Init citadel-internal-service submodule
        run: git submodule update --init --recursive citadel-internal-service
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        # `npm ci` at the workspace root hoists playwright once, instead
        # of installing it both at root AND in citadel-workspaces/. Two
        # copies caused `tsc` to see two distinct
        # `playwright-core/types/types` locations and reject the test
        # build with "Type X/Browser is not assignable to type Y/Browser"
        # plus `Property 'toBeVisible' does not exist`. One hoisted copy
        # makes module resolution coherent. Mirrors the equivalent fix in
        # the parent repo's validate.yml.
        #
        # IMPORTANT: install deps BEFORE `playwright install`. Running
        # `npx playwright install` first triggers npx to auto-fetch the
        # *latest* playwright, which downloads chrome-headless-shell for
        # a different version than the locked one. The test then fails
        # with "Executable doesn't exist at .../chromium_headless_shell-<v>"
        # because the installed binary version doesn't match the one
        # playwright@locked-version expects.
        run: npm ci
      - name: Install Playwright Browsers
        # Now that deps are installed, this resolves to the locked
        # version's `playwright install` and downloads the matching
        # chromium build.
        run: npx playwright install chromium --with-deps
      - name: Symlink workspace deps for integration-tests build
        # `tsc` in integration-tests walks node_modules up the tree
        # (NodeNext). Symlinking playwright from the workspace-root
        # node_modules into integration-tests guarantees closest-
        # resolution lands on the single hoisted copy.
        run: |
          mkdir -p citadel-workspaces/integration-tests/node_modules
          ln -sf ${{ github.workspace }}/parent/node_modules/playwright \
                 citadel-workspaces/integration-tests/node_modules/playwright
          ln -sf ${{ github.workspace }}/parent/node_modules/@playwright \
                 citadel-workspaces/integration-tests/node_modules/@playwright
      - name: Start Services
        env:
          INTERNAL_SERVICE_PORT: '12345'
          WORKSPACE_MASTER_PASSWORD: 'ci-test-password'
        run: docker compose up -d --build --wait
      - name: Dump Service Logs on Start Failure
        if: failure()
        run: |
          echo "=== sync-wasm-client logs ==="
          docker compose logs sync-wasm-client 2>&1 | tail -200
          echo "=== server logs ==="
          docker compose logs server 2>&1 | tail -50
          echo "=== internal-service logs ==="
          docker compose logs internal-service 2>&1 | tail -50
      - name: Clean Docker Build Cache
        run: |
          docker builder prune -af
          docker image prune -af
          df -h
      - name: Run Integration Test
        env:
          IN_CI: 'true'
          WORKSPACE_MASTER_PASSWORD: 'ci-test-password'
          # Several tests call `restartBackendServices` which spawns
          # `docker compose` from the test runner; without
          # INTERNAL_SERVICE_PORT in scope, docker-compose.yml's
          # `${INTERNAL_SERVICE_PORT:-12345}` works at the compose
          # level but the test runner's docker compose invocations
          # would log a warning and (pre-fallback) bake an empty
          # `--bind '0.0.0.0:'` into the container. Set it here so
          # the runner inherits the same value Start Services used.
          INTERNAL_SERVICE_PORT: '12345'
        run: npm run ${{ matrix.test }}
        working-directory: parent/citadel-workspaces/integration-tests
      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.artifact }}
          path: parent/citadel-workspaces/integration-tests/screenshots/
      - name: Upload Trace and Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.artifact }}
          path: |
            parent/citadel-workspaces/integration-tests/test-results/
            parent/citadel-workspaces/integration-tests/reports/
