<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Integrated Workspace</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white">
  <div id="root"></div>

  <script type="text/babel">
    // Mock workspace context
    const WorkspaceContext = React.createContext({
      state: {
        user: { name: 'Test User' },
        offices: {
          'office1': { id: 'office1', name: 'Main Office' }
        },
        rooms: {
          'room1': { id: 'room1', name: 'General', description: 'General discussion' }
        }
      }
    });

    const useWorkspace = () => React.useContext(WorkspaceContext);

    // Simple MDX editor component
    const MDXEditor = ({ initialContent, onSave }) => {
      const [content, setContent] = React.useState(initialContent);
      const [isSaving, setIsSaving] = React.useState(false);

      const handleSave = async () => {
        setIsSaving(true);
        await onSave(content);
        setIsSaving(false);
      };

      return (
        <div className="h-full flex flex-col bg-gray-800 rounded-lg p-4">
          <div className="flex justify-between mb-4">
            <h3 className="text-xl font-semibold">MDX Editor</h3>
            <button
              onClick={handleSave}
              disabled={isSaving}
              className="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg disabled:opacity-50"
            >
              {isSaving ? 'Saving...' : 'Save'}
            </button>
          </div>
          <textarea
            value={content}
            onChange={(e) => setContent(e.target.value)}
            className="flex-1 w-full p-4 bg-gray-900 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-purple-500"
            placeholder="Write your markdown here..."
          />
        </div>
      );
    };

    // P2P Peer List
    const P2PPeerList = ({ onSelectPeer, selectedPeerCid }) => {
      const peers = [
        { cid: '12345', username: 'Alice', fullName: 'Alice Smith', isOnline: true },
        { cid: '67890', username: 'Bob', fullName: 'Bob Johnson', isOnline: false },
        { cid: '11111', username: 'Charlie', fullName: 'Charlie Brown', isOnline: true }
      ];

      return (
        <div className="h-full bg-gray-800 p-4">
          <h3 className="text-lg font-semibold mb-4">Direct Messages</h3>
          <div className="space-y-2">
            {peers.map(peer => (
              <div
                key={peer.cid}
                onClick={() => onSelectPeer(peer.cid)}
                className={`p-3 rounded-lg cursor-pointer transition-colors ${
                  selectedPeerCid === peer.cid 
                    ? 'bg-purple-600' 
                    : 'bg-gray-700 hover:bg-gray-600'
                }`}
              >
                <div className="flex items-center space-x-3">
                  <div className={`w-2 h-2 rounded-full ${peer.isOnline ? 'bg-green-400' : 'bg-gray-500'}`} />
                  <div>
                    <div className="font-medium">{peer.fullName}</div>
                    <div className="text-sm text-gray-400">@{peer.username}</div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // P2P Chat
    const P2PChat = ({ selectedPeerCid }) => {
      const [message, setMessage] = React.useState('');
      const [messages, setMessages] = React.useState([
        { id: 1, from: 'Alice', text: 'Hey! How are you?', timestamp: new Date() },
        { id: 2, from: 'You', text: 'Good! Working on the new features.', timestamp: new Date() }
      ]);

      const handleSend = () => {
        if (message.trim()) {
          setMessages([...messages, {
            id: messages.length + 1,
            from: 'You',
            text: message,
            timestamp: new Date()
          }]);
          setMessage('');
        }
      };

      if (!selectedPeerCid) {
        return (
          <div className="h-full flex items-center justify-center text-gray-500">
            Select a peer to start messaging
          </div>
        );
      }

      return (
        <div className="h-full flex flex-col bg-gray-800 p-4">
          <div className="flex-1 overflow-y-auto space-y-3 mb-4">
            {messages.map(msg => (
              <div key={msg.id} className={`flex ${msg.from === 'You' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-xs px-4 py-2 rounded-lg ${
                  msg.from === 'You' 
                    ? 'bg-purple-600 text-white' 
                    : 'bg-gray-700 text-white'
                }`}>
                  <div className="text-sm font-medium mb-1">{msg.from}</div>
                  <div>{msg.text}</div>
                </div>
              </div>
            ))}
          </div>
          <div className="flex space-x-2">
            <input
              type="text"
              value={message}
              onChange={(e) => setMessage(e.target.value)}
              onKeyPress={(e) => e.key === 'Enter' && handleSend()}
              placeholder="Type a message..."
              className="flex-1 px-4 py-2 bg-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
            />
            <button
              onClick={handleSend}
              className="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded-lg"
            >
              Send
            </button>
          </div>
        </div>
      );
    };

    // Main Workspace View
    const WorkspaceView = ({ officeId, roomId }) => {
      const { state } = useWorkspace();
      const [selectedPeerCid, setSelectedPeerCid] = React.useState(null);
      const [showP2PPanel, setShowP2PPanel] = React.useState(true); // Start with P2P panel visible

      const office = officeId ? state.offices[officeId] : null;
      const room = roomId ? state.rooms[roomId] : null;

      const getInitialContent = () => {
        if (room) {
          return `# ${room.name}\n\n${room.description}\n\n## Discussion Topics\n\n- Feature planning\n- Bug reports\n- General discussion`;
        }
        if (office) {
          return `# ${office.name}\n\n## Welcome to your office!\n\nThis is where you can collaborate with your team.`;
        }
        return `# Welcome to Your Workspace\n\n## Getting Started\n\nSelect an office or room from the sidebar to begin.`;
      };

      const handleSave = async (content) => {
        console.log('Saving content:', content);
        // Simulate save delay
        await new Promise(resolve => setTimeout(resolve, 1000));
        alert('Content saved successfully!');
      };

      return (
        <div className="h-screen flex bg-gray-900">
          {/* Main Content Area */}
          <div className={`${showP2PPanel ? 'flex-[0_0_70%]' : 'flex-1'} transition-all duration-300`}>
            <div className="h-full p-6">
              <h2 className="text-2xl font-bold mb-4">
                {room ? room.name : (office?.name || "Welcome to Your Workspace")}
              </h2>
              <MDXEditor 
                initialContent={getInitialContent()} 
                onSave={handleSave}
              />
            </div>
          </div>

          {/* P2P Messaging Panel */}
          {showP2PPanel && (
            <>
              <div className="w-px bg-gray-700" />
              <div className="flex-[0_0_30%] flex">
                {/* Peer List */}
                <div className="w-64 border-r border-gray-700">
                  <P2PPeerList 
                    onSelectPeer={setSelectedPeerCid}
                    selectedPeerCid={selectedPeerCid}
                  />
                </div>
                
                {/* Message View */}
                <div className="flex-1">
                  <P2PChat selectedPeerCid={selectedPeerCid} />
                </div>
              </div>
            </>
          )}

          {/* P2P Toggle Button */}
          <button
            onClick={() => setShowP2PPanel(!showP2PPanel)}
            className="fixed bottom-6 right-6 bg-purple-600 hover:bg-purple-700 text-white rounded-full p-4 shadow-lg transition-all duration-200 z-50"
            title={showP2PPanel ? "Hide Direct Messages" : "Show Direct Messages"}
          >
            <svg 
              className="w-6 h-6" 
              fill="none" 
              strokeLinecap="round" 
              strokeLinejoin="round" 
              strokeWidth="2" 
              viewBox="0 0 24 24" 
              stroke="currentColor"
            >
              {showP2PPanel ? (
                <path d="M6 18L18 6M6 6l12 12" />
              ) : (
                <path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
              )}
            </svg>
          </button>
        </div>
      );
    };

    // App Component
    const App = () => {
      const workspaceValue = {
        state: {
          user: { name: 'Test User' },
          offices: {
            'office1': { id: 'office1', name: 'Main Office' }
          },
          rooms: {
            'room1': { id: 'room1', name: 'General', description: 'General discussion' }
          }
        }
      };

      return (
        <WorkspaceContext.Provider value={workspaceValue}>
          <WorkspaceView officeId="office1" roomId="room1" />
        </WorkspaceContext.Provider>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
